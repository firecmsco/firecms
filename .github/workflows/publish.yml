name: Publish NPM Packages

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v3.0.1, v3.0.1-pre.0, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 3.4.0. Required for manual runs — tag pushes take it from the tag.'
        required: true
        type: string
      dist_tag:
        description: 'npm dist-tag to publish under (latest, pre, next, canary, beta, alpha)'
        required: false
        default: 'latest'
        type: choice
        options:
          - latest
          - pre
          - next
          - canary
          - beta
          - alpha

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: |
          # --ignore-scripts is deliberate. Workspace packages are linked as `file:`
          # dependencies, so pnpm runs each one's `prepublishOnly` — a full build — during
          # install, in an order that does not respect the dependency graph.
          # @firecms/core then builds before @firecms/ui has emitted its .d.ts, TypeScript
          # falls back to the published @firecms/ui types, and the install fails with
          # errors about props that exist only in the newer source:
          #     CollectionTableToolbar.tsx: Property 'initialValue' does not exist on
          #     type 'IntrinsicAttributes & SearchBarProps'
          # The explicit build step below does this properly, in lerna's topological order.
          pnpm install --frozen-lockfile --ignore-scripts
          # --ignore-scripts also skips genuine postinstalls (esbuild's binary download),
          # so restore those.
          pnpm rebuild

      - name: Set version from tag
        run: |
          # The published version comes from the git tag, not from the committed
          # package.json files.
          #
          # Bumping versions in the repo (`lerna version`) cannot work here: it rewrites
          # the internal @firecms/* ranges to the new version, and pnpm 10 does not link
          # workspace packages without the `workspace:` protocol, so it tries to fetch the
          # not-yet-published version from npm and the lockfile can never be regenerated:
          #     ERR_PNPM_NO_MATCHING_VERSION  No matching version found for
          #     @firecms/core@^3.4.0
          # Leaving the repo on the previous version keeps the lockfile valid, so
          # `--frozen-lockfile` above succeeds.
          #
          # Internal references are pinned EXACTLY. A caret range like "^3.4.0" would also
          # match a later 3.x, and for prereleases it matches the stable release too — npm
          # installs the highest match, which silently mixes versions and ends up with two
          # copies of @firecms/core (two React contexts, and plugins reading an empty
          # navigation controller). Same reasoning as the canary workflow.
          # Tag push: take it from the tag. Manual run: from the `version` input —
          # GITHUB_REF is a branch ref there, so the tag expression would yield
          # "refs/heads/main" and the guard below would (correctly) refuse.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            export RELEASE_VERSION="${{ inputs.version }}"
          else
            export RELEASE_VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "Publishing version: $RELEASE_VERSION"
          node -e "
            const fs = require('fs');
            const V = process.env.RELEASE_VERSION;
            if (!/^[0-9]+\.[0-9]+\.[0-9]+/.test(V)) {
              console.error('Refusing to publish: tag does not look like a version: ' + V);
              process.exit(1);
            }
            const dirs = fs.readdirSync('packages').filter(d => fs.existsSync('packages/' + d + '/package.json'));
            const ours = new Set(dirs.map(d => JSON.parse(fs.readFileSync('packages/' + d + '/package.json', 'utf8')).name));
            for (const d of dirs) {
              const f = 'packages/' + d + '/package.json';
              const p = JSON.parse(fs.readFileSync(f, 'utf8'));
              p.version = V;
              for (const field of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
                if (!p[field]) continue;
                for (const dep of Object.keys(p[field])) if (ours.has(dep)) p[field][dep] = V;
              }
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            }
            console.log('Set ' + dirs.length + ' packages to ' + V + ' with exact internal pins');
          "

      - name: Build packages
        run: pnpm run build

      - name: Determine dist-tag
        id: dist-tag
        run: |
          # If triggered manually, use the input value
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.dist_tag }}" >> $GITHUB_OUTPUT
            echo "Using manual dist-tag: ${{ inputs.dist_tag }}"
            exit 0
          fi

          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Publishing tag: $TAG_NAME"
          
          if [[ "$TAG_NAME" == *"-pre"* ]]; then
            echo "tag=pre" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == *"-next"* ]]; then
            echo "tag=next" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == *"-canary"* ]]; then
            echo "tag=canary" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == *"-beta"* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == *"-alpha"* ]]; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        run: |
          DIST_TAG="${{ steps.dist-tag.outputs.tag }}"
          for dir in packages/*/; do
            if [ -f "$dir/package.json" ]; then
              IS_PRIVATE=$(node -e "const p=require('./$dir/package.json'); console.log(p.private === true)")
              if [ "$IS_PRIVATE" != "true" ]; then
                PKG_NAME=$(node -e "const p=require('./$dir/package.json'); console.log(p.name)")
                echo "📦 Publishing $PKG_NAME..."
                (cd "$dir" && npm publish --provenance --access public --tag "$DIST_TAG") || {
                  echo "⚠️  Failed to publish $PKG_NAME with provenance, retrying without..."
                  (cd "$dir" && npm publish --access public --tag "$DIST_TAG")
                }
              fi
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}