name: Publish Canary Packages

on:
  push:
    branches:
      - canary

concurrency:
  group: canary-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: |
          # --ignore-scripts is deliberate. Workspace packages are linked as `file:`
          # dependencies, so pnpm runs each one's `prepublishOnly` — a full build — during
          # install, in an order that does not respect the dependency graph.
          # @firecms/core then builds before @firecms/ui has emitted its .d.ts, TypeScript
          # falls back to the published @firecms/ui types, and the install fails with
          # errors about props that exist only in the newer source:
          #     CollectionTableToolbar.tsx: Property 'initialValue' does not exist on
          #     type 'IntrinsicAttributes & SearchBarProps'
          # The explicit build step below does this properly, in lerna's topological order.
          pnpm install --frozen-lockfile --ignore-scripts
          # --ignore-scripts also skips genuine postinstalls (esbuild's binary download),
          # so restore those.
          pnpm rebuild

      - name: Build packages
        run: pnpm run build

      - name: Set canary version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BASE_VERSION=$(node -p "require('./lerna.json').version")
          # Exported: the node script below reads it from the environment, and a plain
          # shell assignment is not visible to child processes.
          export CANARY_VERSION="${BASE_VERSION}-canary.${SHORT_SHA}"
          echo "CANARY_VERSION=$CANARY_VERSION" >> $GITHUB_ENV
          echo "Publishing canary version: $CANARY_VERSION"

          # Set versions directly rather than via `lerna version`.
          #
          # Our own cross-package references MUST be pinned exactly. Lerna writes caret
          # ranges, e.g. "@firecms/core": "^3.4.0-canary.abc1234" — but that range also
          # matches the stable 3.4.0, and npm installs the HIGHEST match. A canary install
          # therefore pulled *stable* transitive packages, which in turn require
          # "@firecms/core": "^3.4.0" that the canary core does not satisfy, so npm nested
          # a second copy of core inside them. Two copies of core is two React context
          # objects: the app's <FireCMS> fills one, plugins read the other and get an empty
          # navigation controller ("resolveIdsFrom is not a function").
          #
          # `lerna version --exact` pins correctly but then runs
          # `pnpm install --lockfile-only`, which fails: pnpm does not link workspace
          # packages here, so it tries to fetch the not-yet-published exact version from
          # the registry. Install and build have already run by this point, so the lockfile
          # does not matter — set the versions directly and skip it.
          node -e "
            const fs = require('fs');
            const V = process.env.CANARY_VERSION;
            const dirs = fs.readdirSync('packages').filter(d => fs.existsSync('packages/' + d + '/package.json'));
            const ours = new Set(dirs.map(d => JSON.parse(fs.readFileSync('packages/' + d + '/package.json', 'utf8')).name));
            for (const d of dirs) {
              const f = 'packages/' + d + '/package.json';
              const p = JSON.parse(fs.readFileSync(f, 'utf8'));
              p.version = V;
              for (const field of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
                if (!p[field]) continue;
                for (const dep of Object.keys(p[field])) if (ours.has(dep)) p[field][dep] = V;
              }
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            }
            console.log('Set ' + dirs.length + ' packages to ' + V + ' with exact internal pins');
          "

          # Commit version changes locally so lerna publish doesn't complain
          # (this commit is never pushed back)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: canary version $CANARY_VERSION" --no-verify

      - name: Publish to npm
        run: |
          for dir in packages/*/; do
            if [ -f "$dir/package.json" ]; then
              IS_PRIVATE=$(node -e "const p=require('./$dir/package.json'); console.log(p.private === true)")
              if [ "$IS_PRIVATE" != "true" ]; then
                PKG_NAME=$(node -e "const p=require('./$dir/package.json'); console.log(p.name)")
                echo "📦 Publishing $PKG_NAME..."
                (cd "$dir" && npm publish --provenance --access public --tag canary) || {
                  echo "⚠️  Failed to publish $PKG_NAME with provenance, retrying without..."
                  (cd "$dir" && npm publish --access public --tag canary)
                }
              fi
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "### 🐤 Canary Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ env.CANARY_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install @firecms/core@canary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
